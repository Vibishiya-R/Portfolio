            Have a question? Feel free to reach out.
        </h2>

    </div>


    <!-- CONTACT CONTENT -->
    <section class="contact-section">

        <!-- LEFT SIDE -->
        <div class="contact-info">

            <div class="contact-item">

                    <i class="fa-regular fa-envelope"></i>
                </div>

                <div>
                    <h3>Email</h3>
                    <p>vibishiyarathakrishnan@gmail.com</p>
                </div>

            </div>


            <div class="contact-item">

                <div class="contact-icon">
                    <i class="fa-solid fa-phone"></i>

                    <h3>Phone</h3>
                    <p>+91 99430 41026</p>
                </div>

            <div class="contact-item">

            <div class="contact-item">

                    <p>github.com/Vibishiya-R</p>
                </div>

            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="contact-form">

            <form action="https://formspree.io/f/myezdaep" method="POST">
                <div class="form-row">

                    <input type="text"
       name="name"
       placeholder="Your Name"
       required>

                    <input type="email"
       name="email"
       placeholder="Your Email"
       required>


                <input type="text"
       name="subject"
       placeholder="Subject"
       required>


                <textarea
    name="message"
    placeholder="Your Message"
    rows="7"
    required></textarea>


                <button type="submit">
                    Send Message
                </button>
            </form>

                

        </div>

    </section>
